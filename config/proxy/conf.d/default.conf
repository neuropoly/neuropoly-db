# =============================================================================
# Dev reverse proxy — single port serves both the query UI and federation API
# =============================================================================
# The query_tool React app (NB_API_QUERY_URL=/) sends browser requests to its
# own origin. This proxy routes those API paths to the federation container
# while serving the query UI for everything else.
# =============================================================================

server {
    listen 80;

    resolver ${NB_DNS_RESOLVERS} valid=30s ipv6=off;

    # Runtime-resolved upstream targets.
    set $federation_backend http://federation:8000;
    set $query_ui_backend http://query_federation:5173;

    # Increase timeouts to allow federation aggregation to complete
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    location ~ ^/(?:[^/]+/)?query(/|$) {
        proxy_pass $federation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location ~ ^/(?:[^/]+/)?nodes(/|$) {
        proxy_pass $federation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:[^/]+/)?diagnoses(/|$) {
        proxy_pass $federation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:[^/]+/)?assessments(/|$) {
        proxy_pass $federation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:[^/]+/)?imaging-modalities(/|$) {
        proxy_pass $federation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:[^/]+/)?subjects(/|$) {
        proxy_pass $federation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:[^/]+/)?datasets(/|$) {
        proxy_pass $federation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:[^/]+/)?pipelines(/|$) {
        proxy_pass $federation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:[^/]+/)?docs(/|$) {
        proxy_pass $federation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:[^/]+/)?openapi\.json$ {
        proxy_pass $federation_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Query UI is built with root-relative /assets URLs. Rewrite links so
        # browser requests stay under the public gateway base path.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter 'src="/assets/' 'src="${NB_GATEWAY_BASE_PATH}/assets/';
        sub_filter 'href="/assets/' 'href="${NB_GATEWAY_BASE_PATH}/assets/';
        proxy_pass $query_ui_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
