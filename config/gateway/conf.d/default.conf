server {
    listen 443 ssl;

    resolver ${NB_DNS_RESOLVERS} valid=30s ipv6=off;

    # Runtime-resolved upstream targets.
    set $oauth2_backend http://oauth2-proxy:4180;
    set $oauth2_auth_backend http://oauth2-proxy:4180${NB_GATEWAY_BASE_PATH}/oauth2/auth;
    set $token_validator_backend http://token_validator:4181;
    set $app_ui_backend http://proxy:80;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # Public base path for the app, e.g. /bagel.
    # NB_GATEWAY_BASE_PATH is injected at container startup by envsubst.
    location = ${NB_GATEWAY_BASE_PATH} {
        return 302 ${NB_GATEWAY_BASE_PATH}/;
    }

    # OAuth2 endpoints stay mounted under the same public base path.
    location ^~ ${NB_GATEWAY_BASE_PATH}/oauth2/ {
        proxy_pass $oauth2_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Internal auth check for auth_request.
    location = /auth_internal {
        internal;

        # Use bearer-token fallback only when Authorization header is present.
        if ($http_authorization != "") {
            return 418;
        }

        proxy_pass $oauth2_auth_backend;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    error_page 418 = @token_auth;
    location @token_auth {
        proxy_pass $token_validator_backend;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    auth_request_set $auth_user $upstream_http_x_auth_request_user;

    # API endpoints under the public base path.
    location ~ ^${NB_GATEWAY_BASE_PATH}/(?<api_endpoint>query|nodes|diagnoses|assessments|imaging-modalities|subjects|datasets|pipelines|docs|openapi\.json)(?<remaining_path>/|$) {
        auth_request /auth_internal;
        error_page 401 = @api_unauthorized;

        set $saved_api_endpoint $api_endpoint;
        set $saved_remaining_path $remaining_path;

        set $app_api_backend $app_ui_backend/$saved_api_endpoint$saved_remaining_path$is_args$args;
        proxy_pass $app_api_backend;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Auth-User $auth_user;
        proxy_read_timeout 300;
    }

    # Catch-all for UI routes under the same base path.
    location ^~ ${NB_GATEWAY_BASE_PATH}/ {
        auth_request /auth_internal;
        error_page 401 = @oauth2_signin;

        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;

        # The prebuilt query UI emits /assets/... at root. Rewrite HTML links
        # to keep asset requests under the configured public base path.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter 'src="/assets/' 'src="${NB_GATEWAY_BASE_PATH}/assets/';
        sub_filter 'href="/assets/' 'href="${NB_GATEWAY_BASE_PATH}/assets/';

        # Strip the public base path before forwarding to internal app routes.
        rewrite ^${NB_GATEWAY_BASE_PATH}/(.*)$ /$1 break;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass $app_ui_backend;
        proxy_read_timeout 300;
    }

    # Keep sign-in on the same mounted base path.
    location @oauth2_signin {
        return 302 ${NB_GATEWAY_BASE_PATH}/oauth2/sign_in?rd=$request_uri;
    }

    location @api_unauthorized {
        return 401;
    }

    location / {
        return 404;
    }
}
