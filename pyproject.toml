[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "npdb"
version = "0.1.0"
description = "NeuroPoly database management and BIDS repairing tools."
requires-python = ">=3.12"
dependencies = [
  "bagel==0.11.4",
  "pybids>=0.16",
  "bidsschematools>=1.2,<2",
  "pydicom>=2.4",
  "jupyter",
  "ipywidgets",
  "pandas",
  "tqdm",
  "nibabel",
  "python-dotenv>=1.2.2",
  "typer>=0.24.1",
  "rich>=14.3.3",
  "httpx>=0.25.0",
  "pydantic>=2.0",
  "rapidfuzz>=3.0",
  "tenacity>=8.0",
  "hatchling>=1.32.4",
]

# One extra per provider backend; `all` is the recommended install. Once installers
# support PEP 771, add `default-optional-dependency-keys = ["all"]` to [project].
[project.optional-dependencies]
annotation-automation = [
  "playwright>=1.58.0",
]
# git and git-annex are system executables; the git provider needs no Python package.
git = []
gitea = [
  "py-gitea==0.2.10",
]
kaggle = [
  "kagglehub==1.0.2",
]
mendeley = []
figshare = []
midrc = [
  "gen3==4.28.4"
]
openneuro = [
  "openneuro-py==2026.9.1",
]
zenodo = [
  "zenodo_get==3.1.0",
]
download = [
  "npdb[gitea]",
]
all = [
  "npdb[git,gitea,kaggle,mendeley,figshare,midrc,openneuro,zenodo]",
]
full = [
  "npdb[all,annotation-automation]",
]

[project.scripts]
npdb = "npdb.cli.cli:run"
bids-repair = "bids_repair.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/npdb", "src/bids_repair"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tools", "/scripts/install_bids_validator.sh",
  "/hatch_build.py", "/docs/bids-repair.md", "/README.md",
]
exclude = ["/tools/bids-validator-rust/target"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]
testpaths = ["test"]
markers = [
  "integration: live provider conversions compared to snapshots (opt-in: NPDB_RUN_INTEGRATION=1)",
]

[dependency-groups]
dev = [
  "black>=26.10,<27",
  "isort>=8.0.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '^/(src|test)/.*\.py$'
force-exclude = '''
(
  ^/(?!(src|test)(/|$))
  | /(fixtures|data|vendor|vendored|generated|__pycache__|snapshots)/
)
'''

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src"]
filter_files = true
extend_skip = [
  ".devcontainer", ".github", ".venv", "config", "data", "docs", "scripts", "tools", "tmp",
  "wiki", "neurobagel-recipes", "seed-datasets",
]
extend_skip_glob = [
  "*/fixtures/*", "*/data/*", "*/vendor/*", "*/vendored/*",
  "*/generated/*", "*/snapshots/*",
]
