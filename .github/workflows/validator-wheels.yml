name: Native validator wheels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &paths
      - "src/npdb/**"
      - "tools/**"
      - "hatch_build.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".gitmodules"
      - ".github/workflows/validator-wheels.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            tag: manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            tag: manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize only the pinned GitHub validator source
        run: git submodule update --init --recursive -- tools/bids-validator-rust
      - name: Build wheels and run disconnected acceptance
        run: python tools/build_wheels.py --targets ${{ matrix.target }} --verify
      - uses: actions/upload-artifact@v4
        with:
          name: npdb-${{ matrix.tag }}
          path: |
            dist/wheels/${{ matrix.target }}/*.whl
            dist/wheels/${{ matrix.target }}/*.tar.gz
            dist/wheels/${{ matrix.target }}/validator-sizes.json

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: macos-x86_64
            tag: macosx_11_0_x86_64
          - runner: macos-14
            target: macos-arm64
            tag: macosx_11_0_arm64
          - runner: windows-2022
            target: windows-x86_64
            tag: win_amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --recursive -- tools/bids-validator-rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Build wheels and run offline acceptance
        run: python tools/build_wheels.py --targets ${{ matrix.target }} --verify
      - uses: actions/upload-artifact@v4
        with:
          name: npdb-${{ matrix.tag }}
          path: |
            dist/wheels/${{ matrix.target }}/*.whl
            dist/wheels/${{ matrix.target }}/*.tar.gz
            dist/wheels/${{ matrix.target }}/validator-sizes.json

  python-compatibility:
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: npdb-manylinux_2_28_x86_64
          path: wheel-artifact
      - name: Prepare interpreter-specific dependency wheelhouse
        run: python -m pip wheel --prefer-binary --wheel-dir wheelhouse wheel-artifact/*.whl
      - name: Offline installed-wheel acceptance
        run: |
          python tools/verify_validator_wheel.py wheel-artifact/*.whl \
            --wheelhouse wheelhouse --metrics validator-python-sizes.json
